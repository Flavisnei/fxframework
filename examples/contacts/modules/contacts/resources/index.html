<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contatos · FX</title><link rel="stylesheet" href="/admin/admin.css"><script src="/contacts/app.js" defer></script>
<style>main{padding:24px;max-width:1000px;margin:auto}form{max-width:none}.tools{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.tools label{flex:1}.error{color:#a02020}small{display:block;min-height:1em}textarea{width:100%;min-height:100px;font:inherit}button{margin:4px}td{overflow-wrap:anywhere}dialog{border:1px solid #bbb;border-radius:16px;max-width:600px;width:90%;max-height:90vh;overflow:auto}dialog::backdrop{background:#102b2455}</style></head>
<body><main><h1>Contatos</h1><p>Cadastro da equipe, com busca e permissões por operação. <a href="/contacts/help" target="_blank" rel="noopener">Como usar</a></p>
<p id="status" role="status" aria-live="polite">Carregando…</p><form id="search" class="tools"><label>Nome ou email<input name="q" maxlength="100" autocomplete="off"></label><button>Buscar</button><button type="button" id="new" hidden>Novo contato</button></form>
<div class="table-scroll"><table><thead><tr><th>Nome</th><th>Email</th><th>Telefone</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div><div class="tools"><button id="previous" disabled>Anterior</button><span id="page"></span><button id="next" disabled>Próxima</button></div>
<dialog id="editor"><h2 id="editor-title">Contato</h2><form id="contact" novalidate><label>Nome<input name="name" maxlength="120" aria-describedby="error-name"><small class="error" id="error-name"></small></label><label>Email<input name="email" type="email" maxlength="254" aria-describedby="error-email"><small class="error" id="error-email"></small></label><label>Telefone (opcional)<input name="phone" type="tel" maxlength="40" aria-describedby="error-phone"><small class="error" id="error-phone"></small></label><label>Observações (opcional)<textarea name="notes" maxlength="2000" aria-describedby="error-notes"></textarea><small class="error" id="error-notes"></small></label><p id="form-status" role="status" aria-live="polite"></p><button id="save">Salvar</button><button type="button" id="close">Fechar</button></form></dialog>
</main></body></html>
