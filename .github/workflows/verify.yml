name: Verificar FX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - os: windows-latest
            php: '8.3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, dom, xml, xmlwriter, openssl, zip
          coverage: none
          tools: composer:v2
      - name: Instalar o lock completo
        run: composer install --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
      - name: Validar plataforma real
        run: composer check-platform-reqs
      - name: Instalar exemplos isolados
        shell: bash
        run: |
          set -euo pipefail
          for example in minimal http console modules admin contacts smtp; do
            composer install --working-dir="examples/$example" --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
            composer check-platform-reqs --working-dir="examples/$example"
          done
      - name: Executar verificacoes locais e de integracao
        run: php tools/verify.php
      - name: Catalogo com Composer real
        run: php tests/integration/catalog.php

  modern:
    name: Dependencias modernas / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, dom, xml, xmlwriter, openssl, zip
          coverage: none
          tools: composer:v2
      - name: Resolver stack moderno no piso PHP 8.3
        run: |
          composer config platform.php 8.3.0
          composer update --with=illuminate/container:^13.0 --with=illuminate/database:^13.0 --with=illuminate/http:^13.0 --with=symfony/console:^7.4 --with=symfony/http-foundation:^7.4 --with=symfony/http-kernel:^7.4 --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
          composer check-platform-reqs
      - name: Instalar e conferir exemplos modernos isolados
        run: |
          set -euo pipefail
          for example in minimal http database console auth validation view windows web modular modules admin contacts smtp; do
            composer config --working-dir="examples/$example" platform.php 8.3.0
            composer update --working-dir="examples/$example" --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
            composer check-platform-reqs --working-dir="examples/$example"
          done
          for example in database console auth validation view windows web modular; do
            php examples/verify-package.php "$example"
          done
      - name: Suite e integracoes modernas
        run: php tools/verify.php
      - name: Catalogo com Composer real
        run: php tests/integration/catalog.php

  mariadb:
    name: Admin e Contatos / MariaDB ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: ['10.4', '10.11']
    services:
      database:
        image: mariadb:${{ matrix.database }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_ALLOW_EMPTY_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      FX_TEST_ADMIN_MYSQL: '1'
      FX_TEST_MYSQL_PORT: '3306'
      FX_TEST_MYSQL_USER: root
      FX_TEST_MYSQL_PASSWORD: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, pdo_mysql, pdo_sqlite, dom, xml, xmlwriter, openssl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
      - run: composer install --working-dir=examples/contacts --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
      - run: php vendor/bin/phpunit --do-not-cache-result --filter 'AdminTest|ContactsTest|ResetMailQueueTest|MariaDbConcurrencyTest'
      - run: php tests/integration/contacts.php

      - name: WordPress simples e multisite com container de outro plugin
        if: matrix.database == '10.11'
        shell: bash
        run: |
          set -euo pipefail
          composer update --working-dir=examples/wordpress --with=illuminate/container:^10.48 --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$RUNNER_TEMP/wp-cli.phar"
          php -r "if (hash_file('sha256', getenv('RUNNER_TEMP').'/wp-cli.phar') !== 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c') { exit(1); }"
          mkdir "$RUNNER_TEMP/fx-host"
          composer init --working-dir="$RUNNER_TEMP/fx-host" --name=fx-test/host --require=illuminate/container:^13.0 --no-interaction
          composer install --working-dir="$RUNNER_TEMP/fx-host" --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
          python tests/integration/wordpress-matrix.py --wp-cli "$RUNNER_TEMP/wp-cli.phar" --version 7.1 --multisite --host-autoload "$RUNNER_TEMP/fx-host/vendor/autoload.php"
