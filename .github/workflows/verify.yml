name: Verificar FX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - os: windows-latest
            php: '8.3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, dom, xml, xmlwriter, openssl
          coverage: none
          tools: composer:v2
      - name: Instalar o lock completo
        run: composer install --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
      - name: Validar plataforma real
        run: composer check-platform-reqs
      - name: Instalar exemplos isolados
        shell: bash
        run: |
          set -euo pipefail
          for example in minimal http modules admin contacts smtp; do
            composer install --working-dir="examples/$example" --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts
            composer check-platform-reqs --working-dir="examples/$example"
          done
      - name: Executar verificacoes locais e de integracao
        run: php tools/verify.php
